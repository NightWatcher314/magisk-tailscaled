name: CI

on:
  pull_request:
  push:
    branches: [main, upstream-pr/hardening-webui]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y shellcheck busybox mksh
      - run: .github/tools/build.sh
