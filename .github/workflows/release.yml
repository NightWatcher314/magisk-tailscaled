name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag to create or verify, for example v2.4.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install shell validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox mksh

      - name: Resolve Tag and validate committed version
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git checkout --detach "refs/tags/$TAG^{commit}"
            echo TAG_EXISTS=1 >>"$GITHUB_ENV"
          else
            test "$EVENT_NAME" = workflow_dispatch
            git checkout --detach origin/main
            echo TAG_EXISTS=0 >>"$GITHUB_ENV"
          fi
          git merge-base --is-ancestor HEAD origin/main
          tests/test-version.sh "$TAG"
          test -z "$(git status --short)"

      - name: Build and test exact Tag
        run: .github/tools/build.sh "$TAG"

      - name: Create Tag after successful build
        if: env.TAG_EXISTS == '0'
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          git fetch origin --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"

      - name: Create draft Release and upload exact assets
        run: |
          set -euo pipefail
          cat >release-notes.md <<EOF
          ## Downloads
          - **Magisk-Tailscaled-${TAG}.zip** — lightweight, pinned binaries downloaded and SHA256-verified during install
          - **Magisk-Tailscaled-${TAG}-full.zip** — complete offline package
          - **SHA256SUMS** — checksums for both packages
          EOF
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$release_id" ]; then
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq .draft)" = false ]; then
              echo "RELEASE_ID=$release_id" >>"$GITHUB_ENV"
              echo RELEASE_ALREADY_PUBLISHED=1 >>"$GITHUB_ENV"
              exit 0
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
          gh release create "$TAG" --verify-tag --draft \
              --title "Magisk Tailscaled $TAG" \
              --notes-file release-notes.md \
              "dist/Magisk-Tailscaled-${TAG}.zip" \
              "dist/Magisk-Tailscaled-${TAG}-full.zip" \
              dist/SHA256SUMS
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          test -n "$release_id"
          echo "RELEASE_ID=$release_id" >>"$GITHUB_ENV"

      - name: Download and verify draft assets
        run: |
          set -euo pipefail
          mkdir release-readback
          gh release download "$TAG" --dir release-readback
          (cd release-readback && sha256sum -c SHA256SUMS)
          for file in "Magisk-Tailscaled-${TAG}.zip" "Magisk-Tailscaled-${TAG}-full.zip" SHA256SUMS; do
            local_sha=$(sha256sum "release-readback/$file" | awk '{print $1}')
            remote_digest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq ".assets[] | select(.name == \"$file\") | .digest")
            test "$remote_digest" = "sha256:$local_sha"
          done

          git fetch origin main --tags
          remote_main=$(git rev-parse origin/main)
          remote_tag=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$remote_tag" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$remote_tag" "$remote_main"

          if [ "$remote_tag" = "$remote_main" ]; then
            version_code=$(grep '^versionCode=' module.prop | cut -d= -f2)
            expected_zip="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Magisk-Tailscaled-${TAG}.zip"
            for file in update.json update-arm.json update-arm64.json; do
              curl --fail --silent --show-error --location \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${file}" |
                jq -e --arg tag "$TAG" --arg code "$version_code" --arg zip "$expected_zip" \
                  '.version == $tag and .versionCode == $code and .zipUrl == $zip' >/dev/null
            done
          fi

          if [ "${RELEASE_ALREADY_PUBLISHED:-0}" != 1 ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" |
            jq -e --arg tag "$TAG" '
              .tag_name == $tag and .draft == false and .prerelease == false and
              ([.assets[].name] | sort) == (["Magisk-Tailscaled-" + $tag + "-full.zip", "Magisk-Tailscaled-" + $tag + ".zip", "SHA256SUMS"] | sort)
            ' >/dev/null
